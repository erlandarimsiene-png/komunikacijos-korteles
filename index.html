<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Komunikacijos kortelės</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f6f2ff;
      color: #222;
      text-align: center;
    }

    /* PRADŽIOS LANGAS */
    #startScreen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    h1 {
      margin: 0 0 45px;
      font-size: 42px;
      color: #5d4b8a;
    }

    .category-buttons {
      width: 100%;
      max-width: 700px;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .category-button {
      width: 100%;
      min-height: 110px;
      border: none;
      border-radius: 25px;
      background: #9c86d8;
      color: white;
      font-size: 30px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.14);
    }

    .category-button:hover {
      background: #846dc5;
    }

    /* KORTELĖS LANGAS */
    #cardScreen {
      display: none;
      min-height: 100vh;
      padding: 25px 20px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #cardImage {
      display: block;
      width: auto;
      max-width: 92%;
      max-height: 72vh;
      object-fit: contain;
      margin: 0 auto 25px;
      border-radius: 22px;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.15);
    }

    .navigation {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .nav-button {
      min-width: 170px;
      padding: 17px 28px;
      border: none;
      border-radius: 18px;
      background: #9c86d8;
      color: white;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
    }

    .nav-button:hover {
      background: #846dc5;
    }

    .back-button {
      background: #6f6f6f;
    }

    .back-button:hover {
      background: #555;
    }

    /* TELEFONAMS IR PLANŠETĖMS */
    @media (max-width: 650px) {
      h1 {
        font-size: 32px;
        margin-bottom: 35px;
      }

      .category-button {
        min-height: 95px;
        font-size: 26px;
      }

      #cardScreen {
        padding: 15px 10px;
      }

      #cardImage {
        max-width: 100%;
        max-height: 68vh;
      }

      .navigation {
        width: 100%;
      }

      .nav-button {
        flex: 1;
        min-width: 135px;
        font-size: 21px;
        padding: 16px 18px;
      }
    }
  </style>
</head>

<body>
  <!-- PRADŽIOS LANGAS -->
  <div id="startScreen">
    <h1>Komunikacijos kortelės</h1>

    <div class="category-buttons">
      <button
        class="category-button"
        onclick="openCategory('skauda')"
      >
        Ką man skauda?
      </button>

      <button
        class="category-button"
        onclick="openCategory('poreikiai')"
      >
        Mano poreikiai
      </button>
    </div>
  </div>

  <!-- KORTELĖS LANGAS -->
  <div id="cardScreen">
    <img
      id="cardImage"
      src=""
      alt="Komunikacijos kortelė"
    />

    <div class="navigation">
      <button
        class="nav-button"
        onclick="nextCard()"
      >
        Kita →
      </button>

      <button
        class="nav-button back-button"
        onclick="backToStart()"
      >
        ← Grįžti
      </button>
    </div>
  </div>

  <script>
    /* KORTELĖS „KĄ MAN SKAUDA?“ */
    const skaudaCards = [
      "man-skauda-galva.png",
      "man-skauda-ausi.png",
      "man-skauda-gerkle.png",
      "man-skauda-aki.png",
      "man-skauda-nosi.png",
      "man-skauda-pilva.png",
      "man-skauda-koja.png",
      "man-skauda-ranka.png",
      "man-skauda-nugara.png",
      "man-skauda-pirsta.png",
      "man-skauda-peti.png"
    ];

    /* KORTELĖS „MANO POREIKIAI“ */
    const poreikiaiCards = [
      "as-noriu-valgyti.png",
      "as-noriu-gerti.png",
      "as-noriu-i-tualeta.png",
      "as-noriu-i-lauka.png",
      "as-noriu-i-koridoriu.png",
      "as-noriu-zaisti.png",
      "as-noriu-namo.png",
      "as-noriu-miego.png",
      "as-noriu-atsisesti.png",
      "as-noriu-atsistoti.png",
      "as-noriu-pabegioti.png",
      "as-noriu-vemti.png",
      "as-noriu-issipusti-nosi.png"
    ];

    let currentCards = [];
    let currentIndex = 0;

    /* PASIRENKAME KATEGORIJĄ */
    function openCategory(category) {
      if (category === "skauda") {
        currentCards = skaudaCards;
      }

      if (category === "poreikiai") {
        currentCards = poreikiaiCards;
      }

      currentIndex = 0;

      document.getElementById("startScreen").style.display = "none";
      document.getElementById("cardScreen").style.display = "flex";

      showCurrentCard();
    }

    /* PARODOME DABARTINĘ KORTELĘ */
    function showCurrentCard() {
      const image = document.getElementById("cardImage");

      image.src = currentCards[currentIndex];
    }

    /* KITA KORTELĖ */
    function nextCard() {
      currentIndex++;

      if (currentIndex >= currentCards.length) {
        currentIndex = 0;
      }

      showCurrentCard();
    }

    /* GRĮŽTAME Į PRADŽIĄ */
    function backToStart() {
      document.getElementById("cardScreen").style.display = "none";
      document.getElementById("startScreen").style.display = "flex";

      currentCards = [];
      currentIndex = 0;
    }
  </script>
</body>
</html>
